<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ejecutivo de Mantenimiento V8</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Segoe UI, Arial;
    background:#f4f5f7;
}

.sidebar{
    position:fixed;
    width:250px;
    height:100%;
    background:#2F3136;
    color:white;
    padding:20px;
}

.sidebar h2{
    color:#C9A86A;
}

.main{
    margin-left:270px;
    padding:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.valor{
    font-size:32px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.chart-card{
    background:white;
    border-radius:12px;
    padding:15px;
}

canvas{
    max-height:350px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2F3136;
    color:#C9A86A;
}

th,td{
    padding:8px;
    border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>CS Dashboard</h2>

<p>📊 Dashboard</p>
<p>🔧 Mantenimiento</p>
<p>⚠️ Seguridad</p>
<p>✅ Calidad</p>

<hr>

<div id="ultimaActualizacion"></div>

</div>

<div class="main">

<h1>Dashboard Ejecutivo de Mantenimiento</h1>

<div class="kpis">

<div class="card">
<div id="otTotal" class="valor">0</div>
<div>OT Totales</div>
</div>

<div class="card">
<div id="cerradas" class="valor">0</div>
<div>OT Cerradas</div>
</div>

<div class="card">
<div id="abiertas" class="valor">0</div>
<div>OT Abiertas</div>
</div>

<div class="card">
<div id="cumplimiento" class="valor">0%</div>
<div>Cumplimiento</div>
</div>

</div>

<div class="grid">

<div class="chart-card">
<h3>Pareto Máquinas</h3>
<canvas id="paretoMaquinas"></canvas>
</div>

<div class="chart-card">
<h3>OT por Ejecutor</h3>
<canvas id="cumplimientoTecnicos"></canvas>
</div>

<div class="chart-card">
<h3>Estado OT</h3>
<canvas id="estadoOT"></canvas>
</div>

<div class="chart-card">
<h3>Tipos OT</h3>
<canvas id="tipoOT"></canvas>
</div>

</div>

<br>

<div class="card">

<h2>Ruta Crítica</h2>

<table>

<thead>


<tr>
    <th>Máquina</th>
    <th>Actividad</th>
    <th>Ejecutor</th>
    <th>Estatus</th>
</tr>
</thead>

<tbody id="tablaRuta"></tbody>

</table>

</div>

</div>

<script>

let datos=[];

let chartMaquinas;
let chartTecnicos;
let chartEstados;
let chartTipos;

async function cargarDatos(){

    try{

        const response = await fetch("./datos.json?"+Date.now());

        if(!response.ok){
            throw new Error("No se pudo cargar datos.json");
        }

        datos = await response.json();

        console.log("Registros:",datos.length);

        actualizarDashboard();

    }
    catch(error){

        console.error("ERROR DASHBOARD:",error);

    }

}

function actualizarDashboard(){

    const total = datos.length;

    const cerradas = datos.filter(x =>
        String(x.Estatus || "")
        .toLowerCase()
        .includes("cerrado")
    ).length;

    const abiertas = total - cerradas;

    const cumplimiento =
        total === 0 ? 0 :
        ((cerradas / total) * 100).toFixed(1);

    document.getElementById("otTotal").innerText = total;
    document.getElementById("cerradas").innerText = cerradas;
    document.getElementById("abiertas").innerText = abiertas;
    document.getElementById("cumplimiento").innerText = cumplimiento + "%";

    document.getElementById("ultimaActualizacion").innerHTML =
        "<b>Actualizado:</b><br>" +
        new Date().toLocaleString();

    graficarMaquinas();
    graficarTecnicos();
    graficarEstados();
    graficarTipos();
    construirRuta();
}

function graficarMaquinas(){

    let conteo={};

    datos.forEach(x=>{

        let maq=x["Máquina"] || "Sin dato";

        conteo[maq]=(conteo[maq]||0)+1;
    });

    const top=Object.entries(conteo)
        .sort((a,b)=>b[1]-a[1]);
		if(chartMaquinas) chartMaquinas.destroy();

chartMaquinas=new Chart(
    document.getElementById("paretoMaquinas"),
    {
        type:"bar",
        data:{
            labels:top.map(x=>x[0]),
            datasets:[{
                label:"OT",
                data:top.map(x=>x[1]),
                backgroundColor:"#C9A86A"
            }]
        }
    }
);
		}

function graficarTecnicos(){

    let conteo={};

    datos.forEach(x=>{

        let tecnico=x["EJECUTOR"] || "Sin asignar";

        conteo[tecnico]=(conteo[tecnico]||0)+1;

    });

    const top=Object.entries(conteo)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    if(chartTecnicos) chartTecnicos.destroy();

    chartTecnicos=new Chart(
        document.getElementById("cumplimientoTecnicos"),
        {
            type:"bar",
            data:{
                labels:top.map(x=>x[0]),
                datasets:[{
                    data:top.map(x=>x[1]),
                    backgroundColor:"#2F3136"
                }]
            }
        }
    );
}

function graficarEstados(){

    let estados={};

    datos.forEach(x=>{

        let estado=x["Estatus"] || "Sin dato";

        estados[estado]=(estados[estado]||0)+1;

    });

    if(chartEstados) chartEstados.destroy();

    chartEstados=new Chart(
        document.getElementById("estadoOT"),
        {
            type:"doughnut",
            data:{
                labels:Object.keys(estados),
                datasets:[{
                    data:Object.values(estados)
                }]
            }
        }
    );
}

function graficarTipos(){

    let tipos={};

    datos.forEach(x=>{

        let tipo=x["Tipo "] || x["Tipo"] || "Sin dato";

        tipos[tipo]=(tipos[tipo]||0)+1;

    });

    if(chartTipos) chartTipos.destroy();

    chartTipos=new Chart(
        document.getElementById("tipoOT"),
        {
            type:"pie",
            data:{
                labels:Object.keys(tipos),
                datasets:[{
                    data:Object.values(tipos)
                }]
            }
        }
    );
}

function construirRuta(){

    const abiertas=datos.filter(x=>
        String(x["Estatus"] || "")
        .toLowerCase()
        .indexOf("cerrado")===-1
    );

    let html="";

    abiertas.slice(0,20).forEach(r=>{

        html+=`
        <tr>
            <td>${r["Máquina"] || ""}</td>
            <td>${r["Actividad"] || ""}</td>
            <td>${r["EJECUTOR"] || ""}</td>
            <td>${r["Estatus"] || ""}</td>
        </tr>
        `;
    });

    document.getElementById("tablaRuta").innerHTML=html;
}

window.onload=function(){

    cargarDatos();

};

setInterval(function(){

    cargarDatos();

},300000);

		
</script>
