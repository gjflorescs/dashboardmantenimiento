<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Ejecutivo de Mantenimiento V9</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f5f7;
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:250px;
    height:100vh;
    background:#2F3136;
    color:white;
    padding:20px;
    overflow:auto;
}

.sidebar h2{
    color:#C9A86A;
}

.main{
    margin-left:270px;
    padding:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.valor{
    font-size:32px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.chart-card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

canvas{
    max-height:350px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2F3136;
    color:#C9A86A;
}

td,th{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filtro{
    width:100%;
    padding:8px;
    margin-top:5px;
}

.estado{
    margin-top:15px;
    font-size:12px;
    color:#ddd;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>CS Dashboard V9</h2>

<p>📊 Dashboard</p>
<p>🔧 Mantenimiento</p>
<p>⚠️ Seguridad</p>
<p>✅ Calidad</p>

<hr>

<label>Máquina</label>
<select id="filtroMaquina" class="filtro">
<option value="">Todas</option>
</select>

<label>Estado</label>
<select id="filtroEstado" class="filtro">
<option value="">Todos</option>
</select>

<div class="estado" id="ultimaActualizacion">
Sin actualizar
</div>

</div>

<div class="main">

<h1>Dashboard Ejecutivo de Mantenimiento</h1>

<div class="kpis">

<div class="card">
<div id="otTotal" class="valor">0</div>
<div>OT Totales</div>
</div>

<div class="card">
<div id="otCerradas" class="valor">0</div>
<div>OT Cerradas</div>
</div>

<div class="card">
<div id="otAbiertas" class="valor">0</div>
<div>OT Abiertas</div>
</div>

<div class="card">
<div id="cumplimiento" class="valor">0%</div>
<div>% Cumplimiento</div>
</div>

</div>

<div class="grid">

<div class="chart-card">
<h3>Pareto Máquinas</h3>
<canvas id="paretoMaquinas"></canvas>
</div>

<div class="chart-card">
<h3>OT por Ejecutor</h3>
<canvas id="ejecutores"></canvas>
</div>

<div class="chart-card">
<h3>Estado OT</h3>
<canvas id="estadoOT"></canvas>
</div>

<div class="chart-card">
<h3>Tipo de OT</h3>
<canvas id="tipoOT"></canvas>
</div>

</div>

<br>

<div class="card">

<h2>Ruta Crítica</h2>

<table>

<thead>
<tr>
<th>Máquina</th>
<th>Actividad</th>
<th>Ejecutor</th>
<th>Estatus</th>
</tr>
</thead>

<tbody id="tablaRuta">
</tbody>

</table>

</div>

</div>

<script>

let datos = [];

let chartMaquinas;
let chartEjecutores;
let chartEstados;
let chartTipos;

async function cargarDatos(){

    try{

        const response = await fetch(
					"./datos.json?t=" + Date.now()
					);
        if(!response.ok){
            throw new Error(
                "No se pudo leer datos.json"
            );
        }

        datos = await response.json();

        llenarFiltros();

        actualizarDashboard();

        document.getElementById(
            "ultimaActualizacion"
        ).innerHTML =
        "Actualizado:<br>" +
        new Date().toLocaleString();

        console.log(
            "Registros cargados:",
            datos.length
        );

    }
    catch(error){

        console.error(error);

    }

}

function llenarFiltros(){

    let maquinas =
    [...new Set(
        datos.map(x => x["Máquina"])
        .filter(Boolean)
    )];

    let estados =
    [...new Set(
        datos.map(x => x["Estatus"])
        .filter(Boolean)
    )];

    filtroMaquina.innerHTML =
    '<option value="">Todas</option>';

    maquinas.sort().forEach(m => {

        filtroMaquina.innerHTML +=
        `<option>${m}</option>`;

    });

    filtroEstado.innerHTML =
    '<option value="">Todos</option>';

    estados.sort().forEach(e => {

        filtroEstado.innerHTML +=
        `<option>${e}</option>`;

    });

}

function datosFiltrados(){

    const maquina =
    filtroMaquina.value;

    const estado =
    filtroEstado.value;

    return datos.filter(x => {

        const okMaquina =
        !maquina ||
        x["Máquina"] === maquina;

        const okEstado =
        !estado ||
        x["Estatus"] === estado;

        return okMaquina && okEstado;

    });

}

function actualizarDashboard(){

    const base =
    datosFiltrados();

    const total =
    base.length;

    const cerradas =
    base.filter(x =>
        String(
            x["Estatus"] || ""
        )
        .toLowerCase()
        .includes("cerrado")
    ).length;

    const abiertas =
    total - cerradas;

    const porcentajeCumplimiento =
    total === 0
    ? 0
    : ((cerradas/total)*100)
      .toFixed(1);

    otTotal.innerText = total;
    otCerradas.innerText = cerradas;
    otAbiertas.innerText = abiertas;
    document.getElementById(
    	"cumplimiento"
	).innerText =
	porcentajeCumplimiento + "%";
    graficarMaquinas(base);
    graficarEjecutores(base);
    graficarEstados(base);
    graficarTipos(base);
    construirRuta(base);

}

function graficarMaquinas(base){

    let conteo={};

    base.forEach(x=>{

        const maq =
        x["Máquina"] ||
        "Sin dato";

        conteo[maq] =
        (conteo[maq]||0)+1;

    });

    const top =
    Object.entries(conteo)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    if(chartMaquinas)
    chartMaquinas.destroy();

    chartMaquinas =
    new Chart(
        paretoMaquinas,
        {
            type:"bar",
            data:{
                labels:
                top.map(x=>x[0]),
                datasets:[{
                    label:"OT",
                    data:
                    top.map(x=>x[1]),
                    backgroundColor:"#C9A86A"
                }]
            }
        }
    );
}

function graficarEjecutores(base){

    let conteo={};

    base.forEach(x=>{

        const nombre =
        x["EJECUTOR"] ||
        "Sin asignar";

        if(nombre==="Sin asignar")
        return;

        conteo[nombre] =
        (conteo[nombre]||0)+1;

    });

    const top =
    Object.entries(conteo)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    if(chartEjecutores)
    chartEjecutores.destroy();

    chartEjecutores =
    new Chart(
        ejecutores,
        {
            type:"bar",
            data:{
                labels:
                top.map(x=>x[0]),
                datasets:[{
                    data:
                    top.map(x=>x[1]),
                    backgroundColor:"#2F3136"
                }]
            }
        }
    );
}

function graficarEstados(base){

    let estados={};

    base.forEach(x=>{

        const estado =
        x["Estatus"] ||
        "Sin dato";

        estados[estado] =
        (estados[estado]||0)+1;

    });

    if(chartEstados)
    chartEstados.destroy();

    chartEstados =
    new Chart(
        estadoOT,
        {
            type:"doughnut",
            data:{
                labels:
                Object.keys(estados),
                datasets:[{
                    data:
                    Object.values(estados)
                }]
            }
        }
    );
}

function graficarTipos(base){

    let tipos={};

    base.forEach(x=>{

        const tipo =
        x["Tipo "] ||
        x["Tipo"] ||
        "Sin dato";

        tipos[tipo] =
        (tipos[tipo]||0)+1;

    });

    if(chartTipos)
    chartTipos.destroy();

    chartTipos =
    new Chart(
        tipoOT,
        {
            type:"pie",
            data:{
                labels:
                Object.keys(tipos),
                datasets:[{
                    data:
                    Object.values(tipos)
                }]
            }
        }
    );
}

function construirRuta(base){

    let abiertas =
    base.filter(x =>
        !String(
            x["Estatus"] || ""
        )
        .toLowerCase()
        .includes("cerrado")
    );

    abiertas =
    abiertas.sort((a,b)=>{

        const h1 =
        parseFloat(
            a["Tiempo estimado (h)"]
        ) || 0;

        const h2 =
        parseFloat(
            b["Tiempo estimado (h)"]
        ) || 0;

        return h2-h1;

    });

    let html="";

    abiertas.slice(0,20)
    .forEach(r=>{

        html += `
        <tr>
        <td>${r["Máquina"]||""}</td>
        <td>${r["Actividad"]||""}</td>
        <td>${r["EJECUTOR"]||""}</td>
        <td>${r["Estatus"]||""}</td>
        </tr>
        `;

    });

    tablaRuta.innerHTML = html;

}

filtroMaquina.addEventListener(
"change",
actualizarDashboard
);

filtroEstado.addEventListener(
"change",
actualizarDashboard
);

window.onload=function(){

    cargarDatos();

};

setInterval(
    cargarDatos,
    60000
);

</script>

</body>
</html>
