<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard V10</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
	margin:0;
	font-family:Segoe UI,Arial;
	background:#f4f5f7;
	}

.sidebar{
	position:fixed;left:0;top:0;
	width:250px;
	height:100vh;
	background:#2F3136;
	color:#fff;
	padding:20px;
	}

.sidebar h2{
	color:#C9A86A;
	}

.main{
	margin-left:270px;
	padding:20px;
	}

.kpis{
	display:grid;
	grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
	gap:15px;
	}
	
.card,.chart-card{
	background:#fff;
	border-radius:12px;
	padding:15px;
	box-shadow:0 2px 8px rgba(0,0,0,.15);
	}

.valor{
	font-size:32px;
	font-weight:bold;
	}

.grid{
	display:grid;
	grid-template-columns:1fr 1fr;
	gap:20px;
	margin-top:20px;
	}

table{
	width:100%;
	border-collapse:collapse;
	}
	
th{
	background:#2F3136;
	color:#C9A86A;}

th,td{
	padding:8px;
	border-bottom:1px solid #ddd;
	}
.filtro{
	width:100%;
	padding:8px;
	}

</style>
</head>
<body>
<div class="sidebar">
	<h2>CS Dashboard V10</h2>
	<label>Máquina</label>
	<select id="filtroMaquina" class="filtro">
	<option value="">Todas</option>
	</select><label>Estado</label>
	<select id="filtroEstado" class="filtro">
	<option value="">Todos</option>
	</select>
	<div id="ultimaActualizacion"></div>
</div>
	
<div class="main">
	<h1>Dashboard Ejecutivo de Mantenimiento</h1>
	
	<div class="kpis">
	<div class="card">
	<div id="otTotal" class="valor">0</div>
	<div>OT Totales</div>
	</div>
	<div class="card">
	<div id="otCerradas" class="valor">0</div>
	<div>OT Cerradas</div>
	</div>
	<div class="card">
	<div id="otAbiertas" class="valor">0</div>
	<div>OT Abiertas</div>
	</div>
	<div class="card">
	<div id="cumplimiento" class="valor">0%</div>
	<div>% Cumplimiento</div>
	</div>
	</div>
	<div class="grid">
	<div class="chart-card">
	<canvas id="paretoMaquinas">
	</canvas>
	</div>
	<div class="chart-card">
	<canvas id="ejecutores">
	</canvas>
	</div>
	<div class="chart-card">
	<canvas id="estadoOT">
	</canvas>
	</div>
	<div class="chart-card">
	<canvas id="tipoOT">
	</canvas>
	</div>
	</div>
	<div class="card">
	<h2>Ruta crítica</h2>
	<table>
	<thead>
	<tr>
	<th>Máquina</th>
	<th>Actividad</th>
	<th>Ejecutor</th>
	<th>Estatus</th>
	</tr>
	</thead>
	<tbody id="tablaRuta">
	</tbody>
	</table>
	</div>
	</div>
	<script>
	let datos=[];
	let chartMaquinas,chartEjecutores,chartEstados,chartTipos;
	async function cargarExcel(){
		try{
			const response=await fetch('./Pizarra%20actividades.xlsx?v='+Date.now());
			const data=await response.arrayBuffer();
			const wb=XLSX.read(data,{type:'array'});
			const ws=wb.Sheets['Pizarra DB'];
			
			datos=XLSX.utils.sheet_to_json(ws);
			llenarFiltros();
			actualizarDashboard();
			document.getElementById('ultimaActualizacion').innerHTML='Actualizado:<br>'+new Date().toLocaleString();
			}
			catch(e){
				console.error(e);
				}
				}
			function llenarFiltros(){
				const maquinas=[...new Set(datos.map(x=>x['Máquina']).filter(Boolean))];
				const estados=[...new Set(datos.map(x=>x['Estatus']).filter(Boolean))];
				filtroMaquina.innerHTML='<option value="">Todas</option>';
				maquinas.sort().forEach(v=>filtroMaquina.innerHTML+=`<option>${v}</option>`);
				filtroEstado.innerHTML='<option value="">Todos</option>';
				estados.sort().forEach(v=>filtroEstado.innerHTML+=`<option>${v}</option>`);
			}
			function datosFiltrados(){
				return datos.filter(x=>(!filtroMaquina.value||x['Máquina']===filtroMaquina.value)&&(!filtroEstado.value||x['Estatus']===filtroEstado.value));
				}
			function actualizarDashboard(){
				const base=
    datosFiltrados()
    .filter(x =>
        (x['Máquina']||'').trim()!==''
        &&
        (x['Actividad']||'').trim()!==''
    );
				const total=base.length;
				const cerradas=base.filter(x=>String(x['Estatus']||'').toLowerCase().includes('cerrado')).length;
				const abiertas=total-cerradas;
				const porcentaje=total===0?0:((cerradas/total)*100).toFixed(1);
				otTotal.innerText=total;
				otCerradas.innerText=cerradas;
				otAbiertas.innerText=abiertas;
				document.getElementById('cumplimiento').innerText=porcentaje+'%';
				graficarMaquinas(base);
				graficarEjecutores(base);
				graficarEstados(base);
				graficarTipos(base);
				construirRuta(base);
				}
			function graficarMaquinas(base){
			let c={};
			base.forEach(x=>{
			const m=x['Máquina']||'Sin dato';
				c[m]=(c[m]||0)+1});
			const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10);
			if(chartMaquinas)chartMaquinas.destroy();
			chartMaquinas=new Chart(document.getElementById('paretoMaquinas'),
			{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'OT',data:top.map(x=>x[1]),backgroundColor:'#C9A86A'}]}});
			}
			function graficarEjecutores(base){

    let c={};

    base.forEach(x=>{

        const n=(x['Personal']||'').trim();

        if(!n)return;

        c[n]=(c[n]||0)+1;

    });

    const top=
        Object.entries(c)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    if(chartEjecutores)
        chartEjecutores.destroy();

    chartEjecutores=
        new Chart(
            document.getElementById('ejecutores'),
            {
                type:'bar',
                data:{
                    labels:top.map(x=>x[0]),
                    datasets:[{
                        label:'OT',
                        data:top.map(x=>x[1]),
                        backgroundColor:'#2F3136'
                    }]
                },
                options:{
                    plugins:{
                        legend:{
                            display:false
                        }
                    }
                }
            }
        );
}
			function graficarEstados(base){
				let c={};
				base.forEach(x=>{const e=x['Estatus']||'Sin dato';
				c[e]=(c[e]||0)+1});
					if(chartEstados)chartEstados.destroy();
					chartEstados=new 
					Chart(document.getElementById('estadoOT'),{
					type:'doughnut',data:{labels:Object.keys(c),datasets:[{data:Object.values(c)}]}});
					}
			function graficarTipos(base){

    let c={};

    base.forEach(x=>{

        const tipo=
            x['Personal']||
            'Sin dato';

        c[tipo]=(c[tipo]||0)+1;

    });

    if(chartTipos)
        chartTipos.destroy();

    chartTipos=
        new Chart(
            document.getElementById('tipoOT'),
            {
                type:'pie',
                data:{
                    labels:Object.keys(c),
                    datasets:[{
                        data:Object.values(c)
                    }]
                }
            }
        );
}
			function construirRuta(base){

    let abiertas=
        base.filter(x=>
            !String(
                x['Estatus']||''
            )
            .toLowerCase()
            .includes('cerrado')
        );

    let html='';

    abiertas
    .slice(0,20)
    .forEach(r=>{

        html+=`
        <tr>
            <td>${r['Máquina']||''}</td>
            <td>${r['Actividad']||''}</td>
            <td>${r['Personal']||''}</td>
            <td>${r['Estatus']||''}</td>
        </tr>
        `;

    });

    tablaRuta.innerHTML=html;
}
			filtroMaquina.addEventListener('change',actualizarDashboard);
			filtroEstado.addEventListener('change',actualizarDashboard);
			window.onload=()=>cargarExcel();
			setInterval(cargarExcel,60000);
	</script>
	</body>
</html>
